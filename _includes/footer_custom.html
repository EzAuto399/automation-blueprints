<script>
(function () {
  function renderMermaid() {
    var blocks = document.querySelectorAll('code.language-mermaid, pre code.language-mermaid');
    blocks.forEach(function (el) {
      var txt = (el.textContent || '').trim();
      if (!txt) return;
      var id = 'mmd' + Math.random().toString(36).slice(2, 9);
      mermaid.render(id, txt).then(function (res) {
        var pre = el.closest('pre');
        var holder = document.createElement('div');
        holder.className = 'mermaid-holder';
        holder.innerHTML = res.svg;
        if (pre) pre.replaceWith(holder);
        else el.replaceWith(holder);
      }).catch(function (e) {
        console.warn('mermaid render failed', e);
      });
    });
  }
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: {
      primaryColor: '#fdf3ee',
      primaryBorderColor: '#f07545',
      primaryTextColor: '#111318',
      lineColor: '#5b554c',
      fontFamily: 'system-ui, -apple-system, sans-serif',
      fontSize: '15px'
    }});
    document.addEventListener('DOMContentLoaded', renderMermaid);
    window.addEventListener('load', function () { setTimeout(renderMermaid, 300); });
  }
})();
</script>
